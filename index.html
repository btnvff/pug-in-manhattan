<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#91d9f5" />
    <meta
      name="description"
      content="Большой город. Маленький мопс. Огромный аппетит. Лови сосиски, ставь рекорды."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Мопс" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Мопс на Манхэттене</title>
    <link rel="icon" type="image/png" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main id="game" aria-label="Игра Мопс на Манхэттене">
      <canvas
        id="scene"
        aria-label="Мопс ловит еду на нью-йоркской улице"
      ></canvas
      ><button id="sound" aria-label="Выключить звук"></button>
      <div id="hud">
        <div class="stat primary">
          <div class="label">ОЧКИ</div>
          <b id="sausages">0</b>
        </div>
        <div class="stat">
          <div class="label">СОСИСКИ</div>
          <b id="score">0</b>
        </div>
        <button class="pause" id="pause" aria-label="Пауза">Ⅱ</button>
      </div>
      <div id="condition" role="status" aria-live="polite"></div>
      <div id="rhythm"></div>
      <div id="powers" aria-label="Активные эффекты"></div>
      <div id="overlay"></div>
      <div id="hint">← ТЯНИ ЗДЕСЬ, ЧТОБЫ ДВИГАТЬ МОПСА →</div>
    </main>
    <!-- Порядок скриптов важен: balance.js первым, render.js последним. -->
    <script defer src="./js/balance.js"></script>
    <script defer src="./js/game.js"></script>
    <script defer src="./js/run-state.js"></script>
    <script defer src="./js/powers.js"></script>
    <script defer src="./js/events.js"></script>
    <script defer src="./js/audio.js"></script>
    <script defer src="./js/drawing.js"></script>
    <script defer src="./js/world-details.js"></script>
    <script defer src="./js/world.js"></script>
    <script defer src="./js/characters.js"></script>
    <script defer src="./js/food.js"></script>
    <script defer src="./js/render-feedback.js"></script>
    <script defer src="./js/render-2d.js"></script>
    <script defer src="./js/vendor/three-r185.js"></script>
    <script defer src="./js/pug-3d.js"></script>
    <script defer src="./js/pug-animation.js"></script>
    <script defer src="./js/models-3d.js"></script>
    <script defer src="./js/world-3d.js"></script>
    <script defer src="./js/render-3d.js"></script>
    <script defer src="./js/render.js"></script>
  </body>
</html>
