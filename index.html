<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
    />
    <meta name="theme-color" content="#91d9f5" />
    <meta
      name="description"
      content="Большой город. Маленький мопс. Огромный аппетит. Лови сосиски, ставь рекорды."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Мопс" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>Мопс на Манхэттене</title>
    <link rel="icon" type="image/png" href="./assets/icons/icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest?v=0.0.6" />
    <link rel="apple-touch-icon" href="./assets/icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="./style.css?v=0.0.6" />
  </head>
  <body>
    <main id="game" aria-label="Игра Мопс на Манхэттене">
      <canvas
        id="scene"
        aria-label="Мопс ловит еду на нью-йоркской улице"
      ></canvas>
      <button id="sound" aria-label="Выключить звук"></button>
      <div id="hud">
        <div class="stat primary">
          <div class="label">ОЧКИ</div>
          <b id="points">0</b>
        </div>
        <div class="stat">
          <div class="label">СОСИСКИ</div>
          <b id="sausages">0</b>
        </div>
        <button class="pause" id="pause" aria-label="Пауза">Ⅱ</button>
      </div>
      <div id="condition" role="status" aria-live="polite"></div>
      <div id="rhythm"></div>
      <div id="powers" aria-label="Активные эффекты"></div>
      <div id="overlay"></div>
      <div id="hint">← ТЯНИ ЗДЕСЬ, ЧТОБЫ ДВИГАТЬ МОПСА →</div>
      <div id="build-version" title="Версия правки">v0.0.6</div>
    </main>
    <!-- Definitions first; bootstrap alone binds input and starts the lifecycle. -->
    <script defer src="./js/game/balance.js?v=0.0.6"></script>
    <script defer src="./js/world/world-ratio.js?v=0.0.6"></script>
    <script defer src="./js/app/ui.js?v=0.0.6"></script>
    <script defer src="./js/game/game.js?v=0.0.6"></script>
    <script defer src="./js/character/pug-motion.js?v=0.0.6"></script>
    <script defer src="./js/app/input.js?v=0.0.6"></script>
    <script defer src="./js/game/run-state.js?v=0.0.6"></script>
    <script defer src="./js/game/powers.js?v=0.0.6"></script>
    <script defer src="./js/game/events.js?v=0.0.6"></script>
    <script defer src="./js/game/street-events.js?v=0.0.6"></script>
    <script defer src="./js/systems/audio.js?v=0.0.6"></script>
    <script defer src="./js/render/canvas-primitives.js?v=0.0.6"></script>
    <script defer src="./js/render/feedback-overlay.js?v=0.0.6"></script>
    <script defer src="./js/vendor/three-r185.js?v=0.0.6"></script>
    <script defer src="./js/character/pug-3d.js?v=0.0.6"></script>
    <script defer src="./js/character/pug-animation.js?v=0.0.6"></script>
    <script defer src="./js/world/models-3d.js?v=0.0.6"></script>
    <script defer src="./js/world/ratio-scene.js?v=0.0.6"></script>
    <script defer src="./js/render/ratio-diagnostics.js?v=0.0.6"></script>
    <script defer src="./js/render/renderer-3d.js?v=0.0.6"></script>
    <script defer src="./js/app/bootstrap.js?v=0.0.6"></script>
  </body>
</html>
