name: 3D-only publication
on:
  push:
    branches: [chatgpt/3d-only-publication]
    paths: [.github/workflows/3d-only-publication.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: bash
    env:
      MERGE_SHA: 61388622768eddc05da158c318d66a3f72a28f83
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Confirm exact main and export history for local sync
        run: |
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$MERGE_SHA"
          test "$(git rev-parse HEAD^{tree})" = a719ef8719a0ba81d79fc0905768176ce454917f
          mkdir -p "$RUNNER_TEMP/3d-only-live"
          git bundle create "$RUNNER_TEMP/3d-only-live/main.bundle" refs/heads/main
          sha256sum "$RUNNER_TEMP/3d-only-live/main.bundle" > "$RUNNER_TEMP/3d-only-live/bundle-sha256.txt"
          git status --short --branch > "$RUNNER_TEMP/3d-only-live/git-status.txt"
          test -z "$(git status --porcelain)"
      - name: Install external browser test tools
        run: |
          python -m pip install --target "$RUNNER_TEMP/browser-tools" playwright==1.57.0
          export PYTHONPATH="$RUNNER_TEMP/browser-tools"
          python -m playwright install --with-deps chromium
          echo "PYTHONPATH=$PYTHONPATH" >> "$GITHUB_ENV"
      - name: Wait for successful Pages deployment of this exact main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..30}; do
            gh api "repos/btnvff/pug-in-manhattan/actions/runs?head_sha=$MERGE_SHA&per_page=20" > "$RUNNER_TEMP/3d-only-live/pages.json"
            if jq -e '.workflow_runs | any(.name == "pages build and deployment" and .conclusion == "success")' "$RUNNER_TEMP/3d-only-live/pages.json"; then exit 0; fi
            sleep 5
          done
          exit 1
      - name: Live assets, gameplay, obsolete URL and WebGL failure/reload
        run: |
          cat > "$RUNNER_TEMP/live.py" <<'PY'
          import hashlib, json, os, re, time
          from pathlib import Path
          from urllib.parse import urlsplit
          from playwright.sync_api import sync_playwright
          root = Path.cwd()
          out = Path(os.environ['RUNNER_TEMP']) / '3d-only-live'
          base = 'https://btnvff.github.io/pug-in-manhattan/'
          html = (root / 'index.html').read_bytes()
          urls = list(dict.fromkeys(['index.html', 'js/vendor/three-LICENSE.txt'] + re.findall(r'(?:src|href)="\./(.*?)"', html.decode()) + ['icon-512.png']))
          removed = ['js/render-2d.js', 'js/characters.js', 'js/food.js']
          report = {'commit': os.environ['MERGE_SHA'], 'version': '0.0.2', 'assets': [], 'removed': [], 'checks': [], 'errors': [], 'expected_diagnostics': [], 'bad_responses': [], 'requests': []}
          def badge(page):
              assert page.locator('#build-version').inner_text() == 'v0.0.2'
              assert page.locator('#build-version').is_visible()
              assert page.evaluate('''() => {
                const n = document.getElementById('build-version'), b = n.getBoundingClientRect();
                const g = document.getElementById('game').getBoundingClientRect();
                return Math.abs(b.x+b.width/2-g.x-g.width/2)<1 && b.bottom<=g.bottom &&
                  b.top>g.top+g.height*.94 && getComputedStyle(n).pointerEvents==='none';
              }''')
          def observe(page, injected=False):
              page.on('pageerror', lambda e: report['errors'].append(str(e)))
              def console(msg):
                  if msg.type != 'error': return
                  if injected and 'Error creating WebGL context' in msg.text:
                      report['expected_diagnostics'].append(msg.text)
                  else: report['errors'].append(msg.text)
              page.on('console', console)
              page.on('response', lambda r: report['bad_responses'].append({'url':r.url,'status':r.status}) if r.status>=400 else None)
              page.on('requestfailed', lambda r: report['bad_responses'].append({'url':r.url,'failure':r.failure}))
              page.on('request', lambda r: report['requests'].append(r.url))
          def unavailable(page):
              page.wait_for_function("graphicsUnavailable && document.getElementById('game').dataset.view === 'unavailable'")
              assert page.get_by_role('alert').is_visible()
              assert 'WebGL 2' in page.get_by_role('alert').inner_text()
              assert page.locator('#scene-3d, #start, #resume, #restart').count() == 0
              assert page.get_by_role('button', name='Перезагрузить', exact=True).is_visible()
              badge(page)
              frozen = page.evaluate('JSON.stringify([state,elapsed,points,items,powerTimers,clock,worldTime])')
              page.wait_for_timeout(300)
              page.evaluate('start(); menu(); tick(.04); resize();')
              assert page.evaluate('JSON.stringify([state,elapsed,points,items,powerTimers,clock,worldTime])') == frozen
          try:
              with sync_playwright() as p:
                  http = p.request.new_context()
                  for attempt in range(30):
                      response = http.get(base, timeout=30000)
                      if response.ok and response.body()==html: break
                      time.sleep(5)
                  else: raise AssertionError('Published root HTML does not match merged main')
                  for url in urls:
                      r = http.get(base+url)
                      expected = (root/urlsplit(url).path).read_bytes()
                      assert r.status==200 and r.body()==expected, url
                      report['assets'].append({'url':url,'status':r.status,'sha256':hashlib.sha256(expected).hexdigest()})
                  for url in removed:
                      r = http.get(base+url)
                      assert r.status==404, 'Deleted file still served: '+url
                      report['removed'].append({'url':url,'expected_status':404})
                  browser = p.chromium.launch(headless=True,args=['--no-sandbox','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
                  for label, query in [('default',''),('obsolete-url','?view=2d')]:
                      context = browser.new_context(viewport={'width':390,'height':844},is_mobile=True,has_touch=True)
                      page = context.new_page()
                      observe(page)
                      page.goto(base+query,wait_until='networkidle')
                      assert page.locator('#game').get_attribute('data-view')=='3d'
                      assert page.evaluate("typeof renderCanvasScene === 'undefined' && typeof fallbackToCanvas === 'undefined'")
                      badge(page)
                      page.screenshot(path=str(out/(label+'-menu.png')))
                      page.get_by_role('button',name='Старт',exact=True).click()
                      page.wait_for_function("state === 'play' && elapsed > .1")
                      page.evaluate('spawnIn=999; items=[]; document.activeElement.blur();')
                      x0 = page.evaluate('x')
                      page.keyboard.down('ArrowRight')
                      page.wait_for_function('x > '+str(x0+20))
                      page.keyboard.up('ArrowRight')
                      b = page.locator('#build-version').bounding_box()
                      cdp = context.new_cdp_session(page)
                      x0 = page.evaluate('x')
                      cdp.send('Input.dispatchTouchEvent',{'type':'touchStart','touchPoints':[{'x':b['x']+b['width']/2,'y':b['y']+b['height']/2}]})
                      cdp.send('Input.dispatchTouchEvent',{'type':'touchMove','touchPoints':[{'x':b['x']+b['width']/2-85,'y':b['y']+b['height']/2}]})
                      page.wait_for_function('x < '+str(x0-20))
                      cdp.send('Input.dispatchTouchEvent',{'type':'touchEnd','touchPoints':[]})
                      page.evaluate('items=[{type:0,x,y:catchY(),speed:120,age:0,variant:0,used:false}];')
                      page.wait_for_function('sausages === 1 && points === 1')
                      assert page.locator('#points').inner_text()=='1'
                      assert page.locator('#sausages').inner_text()=='1'
                      happy0 = page.evaluate('happy')
                      page.evaluate('items=[{type:4,x,y:catchY(),speed:120,age:0,variant:0,used:false}];')
                      page.wait_for_function('happy < '+str(happy0))
                      badge(page)
                      page.screenshot(path=str(out/(label+'-play.png')))
                      page.get_by_role('button',name='Пауза',exact=True).click()
                      page.wait_for_function("state === 'pause'")
                      frozen=page.evaluate('elapsed')
                      for size in [{'width':844,'height':390},{'width':320,'height':568},{'width':677,'height':1264},{'width':390,'height':844}]:
                          page.set_viewport_size(size)
                          page.wait_for_timeout(150)
                          badge(page)
                      assert page.evaluate('elapsed')==frozen
                      page.get_by_role('button',name='Продолжить',exact=True).click()
                      page.wait_for_function('elapsed > '+str(frozen))
                      page.get_by_role('button',name='Пауза',exact=True).click()
                      page.get_by_role('button',name='Заново',exact=True).click()
                      page.wait_for_function("state === 'play' && elapsed < 2 && points === 0")
                      badge(page)
                      if label=='default':
                          page.evaluate("document.getElementById('scene-3d').getContext('webgl2').getExtension('WEBGL_lose_context').loseContext()")
                          unavailable(page)
                          assert page.evaluate('state')=='pause'
                          page.screenshot(path=str(out/'graphics-unavailable.png'))
                          with page.expect_navigation(wait_until='networkidle'):
                              page.get_by_role('button',name='Перезагрузить',exact=True).click()
                          page.wait_for_function("!graphicsUnavailable && state==='menu' && document.getElementById('game').dataset.view==='3d'")
                          badge(page)
                          page.get_by_role('button',name='Старт',exact=True).click()
                          page.wait_for_function("state==='play' && elapsed>.1")
                          report['checks'].append('PASS: live WebGL context loss stops safely; real reload restores playable 3D')
                      report['checks'].append('PASS: '+label+' loads only 3D; Start, keyboard, touch through badge, good/bad pickups, HUD, pause/resume, restart and 4 resize fits')
                      context.close()
                  context=browser.new_context(viewport={'width':390,'height':844})
                  blocked=context.new_page()
                  observe(blocked,injected=True)
                  blocked.add_init_script('''const original=HTMLCanvasElement.prototype.getContext;
                    HTMLCanvasElement.prototype.getContext=function(kind,...args){return kind.startsWith('webgl')?null:original.call(this,kind,...args);};''')
                  for query in ['', '?view=2d', '?ratio=reference']:
                      blocked.goto(base+query,wait_until='networkidle')
                      unavailable(blocked)
                  report['checks'].append('PASS: unavailable WebGL has visible stopped error on normal, obsolete and diagnostic URLs; no alternative game')
                  context.close()
                  context=browser.new_context(viewport={'width':390,'height':844})
                  missing=context.new_page()
                  observe(missing)
                  missing.add_init_script("Object.defineProperty(window,'THREE',{configurable:true,get:()=>undefined,set(){}});")
                  missing.goto(base,wait_until='networkidle')
                  unavailable(missing)
                  report['checks'].append('PASS: missing local Three dependency shows actionable error')
                  context.close()
                  browser.close()
                  http.dispose()
              assert not report['errors'] and not report['bad_responses'], report
              assert not any(urlsplit(url).path.endswith(tuple(removed)) for url in report['requests'])
              print('PASS: exact deployed v0.0.2 assets; 3D-only gameplay; obsolete query cannot enable 2D; missing WebGL/Three and context loss stop safely; reload restores 3D; no unexpected console errors or HTTP failures.')
          finally:
              (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2))
          PY
          xvfb-run -a python "$RUNNER_TEMP/live.py" | tee "$RUNNER_TEMP/3d-only-live/live.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 3d-only-live-verification
          path: ${{ runner.temp }}/3d-only-live
          retention-days: 7
