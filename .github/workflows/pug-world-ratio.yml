name: PUG WORLD RATIO
on:
  push:
    branches: [pug-world-ratio-v1]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and existing simulation checks
        run: |
          for file in js/*.js; do node --check "$file"; done
          node tests/gameplay.test.js
          node tests/character.test.js
          node tests/city-perspective.test.js
      - name: Ratio checks when present
        run: |
          if test -f tests/world-ratio.test.js; then node tests/world-ratio.test.js; fi
      - name: Package reproducible review build
        if: always()
        run: |
          mkdir -p /tmp/pug-ratio-review
          git archive --format=zip --output=/tmp/pug-ratio-review/pug-in-manhattan.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pug-world-ratio-review
          path: /tmp/pug-ratio-review/
          retention-days: 7
