name: Structural verification support
on:
  push:
    branches: [chatgpt/structure-verification]
    paths: [.github/workflows/structure-verification.yml]
permissions:
  contents: read
  statuses: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      PHASE: review
      BASE_SHA: 61388622768eddc05da158c318d66a3f72a28f83
      EXPECTED_SHA: eb28df9bfc4317ec313bb0d3085d01c356c13842
      EXPECTED_TREE: f0e7b3057799037137abd3430b145dff73df9406
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check exact reviewed source and clean tree
        run: |
          mkdir -p "$RUNNER_TEMP/structure-checks"
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          git diff --check "$BASE_SHA"
          git log "$BASE_SHA"..HEAD --format=fuller > "$RUNNER_TEMP/structure-checks/commits.txt"
          git diff --stat "$BASE_SHA" > "$RUNNER_TEMP/structure-checks/diff-stat.txt"
          if [ "$PHASE" = review ]; then
            test "$(git rev-parse origin/main)" = "$BASE_SHA"
            test "$(git rev-parse origin/refactor/project-structure)" = "$EXPECTED_SHA"
          else
            test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
            git checkout main
            git pull --ff-only origin main
          fi
      - name: Install pinned external Chromium test tools
        run: |
          python -m pip install --target "$RUNNER_TEMP/browser-tools" playwright==1.57.0
          export PYTHONPATH="$RUNNER_TEMP/browser-tools"
          python -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$(python -c 'import playwright,pathlib; print(pathlib.Path(playwright.__file__).parent / "driver/package")')" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: Run all eleven suites over genuine HTTP
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/structure-checks/screenshots
        run: |
          xvfb-run -a node tests/run.js --all 2>&1 | tee "$RUNNER_TEMP/structure-checks/tests.log"
      - name: Compare three ten-minute seeded runs
        run: |
          node tests/game/gameplay.test.js --compare "$BASE_SHA" --seconds 600 2>&1 | tee "$RUNNER_TEMP/structure-checks/parity.log"
      - name: Compare twenty-five exact visual pairs
        if: env.PHASE == 'review'
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/structure-checks/visual-screenshots
        run: |
          xvfb-run -a node tests/visual-compare.js "$BASE_SHA" 2>&1 | tee "$RUNNER_TEMP/structure-checks/visual.log"
      - name: Verify deployed resource bytes and native production interactions
        if: env.PHASE == 'live'
        env:
          TEST_BASE_URL: https://btnvff.github.io/pug-in-manhattan/
          SCREENSHOT_DIR: ${{ runner.temp }}/structure-checks/production
        run: |
          xvfb-run -a node tests/browser/live-verify.js 2>&1 | tee "$RUNNER_TEMP/structure-checks/live.log"
      - name: Run full browser regression against actual GitHub Pages
        if: env.PHASE == 'live'
        env:
          TEST_BASE_URL: https://btnvff.github.io/pug-in-manhattan/
          SCREENSHOT_DIR: ${{ runner.temp }}/structure-checks/production-regression
        run: |
          xvfb-run -a node tests/run.js --browser 2>&1 | tee "$RUNNER_TEMP/structure-checks/live-browser.log"
      - name: Record verified SHA and synchronized repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          if [ "$PHASE" = review ]; then
            test "$(git rev-parse origin/main)" = "$BASE_SHA"
            test "$(git rev-parse origin/refactor/project-structure)" = "$EXPECTED_SHA"
            context=structure/verification
            description='11 HTTP suites, 3 long seeded runs and 25 exact visual pairs passed'
          else
            test "$(git branch --show-current)" = main
            test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
            context=structure/live
            description='Exact Pages bytes, native interactions and 5 live browser suites passed'
          fi
          gh api --method POST "repos/btnvff/pug-in-manhattan/statuses/$EXPECTED_SHA" -f state=success -f context="$context" -f description="$description" -f target_url="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          git bundle create "$RUNNER_TEMP/structure-checks/repository.bundle" --all
          git status --short --branch > "$RUNNER_TEMP/structure-checks/git-status.txt"
          printf 'HEAD=%s\nTREE=%s\nBASE=%s\nPHASE=%s\n' "$EXPECTED_SHA" "$EXPECTED_TREE" "$BASE_SHA" "$PHASE" > "$RUNNER_TEMP/structure-checks/verified.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: structural-${{ env.PHASE }}-checks
          path: ${{ runner.temp }}/structure-checks
          retention-days: 7
