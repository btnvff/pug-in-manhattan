name: WebGL-only publication
on:
  push:
    branches: [chatgpt/three-only-publication]
    paths: [.github/workflows/three-only-publication.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 8dd3db9fea6b54d3afdf1392e17a369aa0efba5b
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore and checksum the exact reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/btnvff/pug-in-manhattan/git/blobs/1a82d18e095a8a6793aca78500db8e50be8f7e97 > "$RUNNER_TEMP/transport.json"
          python - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          out = Path(os.environ['RUNNER_TEMP'])
          encoded = ''.join(json.loads((out / 'transport.json').read_text())['content'].split())
          # Repair two identified transcription insertions, then require the
          # original local bundle digest before importing any Git objects.
          assert encoded.count('OE0mtzlzlss') == 1 and encoded.count('ILtuPWBie4ih') == 1
          encoded = encoded.replace('OE0mtzlzlss', 'OE0mtzlss').replace('ILtuPWBie4ih', 'ILtuPWB4ih')
          bundle = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(bundle).hexdigest() == 'a40b4012228afa316c9ca3fe1e27504bbb0633296271c97e82f69c87886bc8f5'
          (out / 'three-only.bundle').write_bytes(bundle)
          PY
          git bundle verify "$RUNNER_TEMP/three-only.bundle"
          git fetch "$RUNNER_TEMP/three-only.bundle" refs/heads/chatgpt/three-only:refs/heads/chatgpt/three-only
          git checkout chatgpt/three-only
          test "$(git rev-parse HEAD)" = f1a5949576c57177f59d846ca31d699f6f2a5e38
          test "$(git rev-parse HEAD^{tree})" = ba12134f35a0622fd53e657157a72f4020cbdc99
          git diff --check HEAD^
      - name: Install external browser testing tools
        run: |
          python -m pip install --target "$RUNNER_TEMP/browser-tools" playwright==1.57.0
          export PYTHONPATH="$RUNNER_TEMP/browser-tools"
          python -m playwright install --with-deps chromium
          echo "PLAYWRIGHT_MODULE=$(python -c 'import playwright, pathlib; print(pathlib.Path(playwright.__file__).parent / "driver/package")')" >> "$GITHUB_ENV"
          echo "CHROMIUM_PATH=$(python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" >> "$GITHUB_ENV"
      - name: All Node and real HTTP browser suites and gameplay parity
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/three-only-checks/screenshots
        run: |
          mkdir -p "$RUNNER_TEMP/three-only-checks"
          xvfb-run -a node tests/run.js --all | tee "$RUNNER_TEMP/three-only-checks/tests.log"
          node tests/gameplay.test.js --compare 8dd3db9fea6b54d3afdf1392e17a369aa0efba5b | tee "$RUNNER_TEMP/three-only-checks/parity.log"
          test -z "$(git status --porcelain)"
      - name: Push the feature branch without force
        run: |
          git fetch origin
          test "$(git rev-parse origin/main)" = 8dd3db9fea6b54d3afdf1392e17a369aa0efba5b
          git push -u origin chatgpt/three-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: three-only-checks
          path: ${{ runner.temp }}/three-only-checks
          retention-days: 7
